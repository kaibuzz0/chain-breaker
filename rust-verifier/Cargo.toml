[package]
name = "chainbreaker-v2-verifier"
version = "0.1.0"
edition = "2021"
rust-version = "1.79.0"
description = "Independent Rust verifier for Chain-Breaker Protocol V2 test vectors."
license = "MIT"

[[bin]]
name = "chainbreaker-v2-verifier"
path = "src/main.rs"

[dependencies]
sha2 = "=0.10.8"
ed25519-dalek = "=2.1.1"
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
hex = "=0.4.3"
thiserror = "=1.0.61"

base64ct = "=1.6.0"
const-oid = "=0.9.6"
der = "=0.7.9"
pkcs8 = "=0.10.2"
spki = "=0.7.3"
generic-array = "=0.14.7"
signature = "=2.2.0"
ed25519 = "=2.2.3"
zeroize = "=1.7.0"
subtle = "=2.5.0"
curve25519-dalek = "=4.1.2"
curve25519-dalek-derive = "=0.1.0"
fiat-crypto = "=0.2.5"
digest = "=0.10.7"
cpufeatures = "=0.2.12"
typenum = "=1.17.0"

[dev-dependencies]
serde_json = "=1.0.117"
hex = "=0.4.3"
