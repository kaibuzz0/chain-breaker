[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chainbreaker"
version = "0.2.0"
description = "A working scripture-preservation ledger with content-addressed archives, curator attestations, and proof-of-work anchoring."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "kaibuzz0"}]
keywords = ["blockchain", "archive", "scripture", "attestation", "merkle", "proof-of-work"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=50.0.0,<51",
    "click>=8.1.0,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9",
    "pytest-cov>=4.1.0,<6",
    "ruff>=0.4.0,<0.9",
    "mypy>=1.10.0,<2",
    "pip-audit>=2.7.0,<3",
    "bandit>=1.7.0,<2",
    "build>=1.2.0,<2",
    "mutmut>=3.2.0,<4",
]

[project.scripts]
chainbreaker = "chainbreaker.cli:main"

[tool.setuptools.packages.find]
include = ["chainbreaker*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
