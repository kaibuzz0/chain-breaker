name: Focused Governance Audit Fix

on:
  push:
    branches: [repo-sequential-audit]

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repo-sequential-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Parameterize governance network identity
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('chainbreaker/governance.py')
          s = p.read_text()

          for cls_name in ('CuratorRegisterTx', 'CuratorRotateTx', 'CuratorRevokeTx'):
              old = f'def from_dict(cls, data: dict[str, Any]) -> {cls_name}:'
              new = f'def from_dict(cls, data: dict[str, Any], expected_network_id: str = NETWORK_ID) -> {cls_name}:'
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit(f'{cls_name} from_dict signature not found')

          old = '''        if data.get("network_id", NETWORK_ID) != NETWORK_ID:\n            raise GovernanceError("wrong network_id")\n'''
          new = '''        network_id = data.get("network_id", NETWORK_ID)\n        if network_id != expected_network_id:\n            raise GovernanceError("wrong network_id")\n'''
          if s.count(old) == 3:
              s = s.replace(old, new)
          elif s.count(new) != 3:
              raise SystemExit('governance network checks not found')

          inserts = [
              ('''            governance_signatures=_require_signatures(data["governance_signatures"]),\n        )\n\n\n@dataclass(frozen=True)\nclass CuratorRotateTx:''',
               '''            governance_signatures=_require_signatures(data["governance_signatures"]),\n            network_id=network_id,\n        )\n\n\n@dataclass(frozen=True)\nclass CuratorRotateTx:'''),
              ('''            curator_signature_hex=_require_hex_hash(data["curator_signature"], "curator_signature", 128),\n        )\n\n\n@dataclass(frozen=True)\nclass CuratorRevokeTx:''',
               '''            curator_signature_hex=_require_hex_hash(data["curator_signature"], "curator_signature", 128),\n            network_id=network_id,\n        )\n\n\n@dataclass(frozen=True)\nclass CuratorRevokeTx:'''),
              ('''            curator_signature_hex=_require_hex_hash(data["curator_signature"], "curator_signature", 128),\n        )\n\n\nclass GovernanceContext:''',
               '''            curator_signature_hex=_require_hex_hash(data["curator_signature"], "curator_signature", 128),\n            network_id=network_id,\n        )\n\n\nclass GovernanceContext:'''),
          ]
          for old, new in inserts:
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit('transaction network_id preservation pattern not found')

          old = '    def __init__(self, public_keys_hex: list[str], threshold: int):\n'
          new = '    def __init__(self, public_keys_hex: list[str], threshold: int, network_id: str = NETWORK_ID):\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('GovernanceContext signature not found')

          old = '''        self.public_keys_hex = tuple(public_keys_hex)\n        self.threshold = threshold\n'''
          new = '''        if not isinstance(network_id, str) or not network_id:\n            raise GovernanceError("network_id must be a non-empty string")\n        self.public_keys_hex = tuple(public_keys_hex)\n        self.threshold = threshold\n        self.network_id = network_id\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('GovernanceContext assignment block not found')

          old = '''            "network_id": NETWORK_ID,\n            "version": PROTOCOL_VERSION,\n            "type": "registry",\n'''
          new = '''            "network_id": self.network_id,\n            "version": PROTOCOL_VERSION,\n            "type": "registry",\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('GovernanceContext message network id not found')

          old = 'def governance_message(body_dict: dict[str, Any]) -> bytes:\n'
          new = 'def governance_message(body_dict: dict[str, Any], network_id: str = NETWORK_ID) -> bytes:\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('governance_message signature not found')

          old = '''        "network_id": NETWORK_ID,\n        "version": PROTOCOL_VERSION,\n        "type": "registry",\n'''
          new = '''        "network_id": network_id,\n        "version": PROTOCOL_VERSION,\n        "type": "registry",\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('governance_message network id not found')

          old = '''    body_dict: dict[str, Any],\n    key_index: int,\n) -> GovernanceSignature:\n'''
          new = '''    body_dict: dict[str, Any],\n    key_index: int,\n    network_id: str = NETWORK_ID,\n) -> GovernanceSignature:\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('make_governance_signature signature not found')

          old = '    msg = governance_message(body_dict)\n'
          new = '    msg = governance_message(body_dict, network_id=network_id)\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('make_governance_signature message call not found')

          p.write_text(s)

          p = Path('chainbreaker/chain.py')
          s = p.read_text()
          old = '        self._governance_context = GovernanceContext(self.governance_keys, self.governance_threshold)\n'
          new = '        self._governance_context = GovernanceContext(self.governance_keys, self.governance_threshold, network_id=self.network_id)\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Ledger GovernanceContext wiring not found')
          for cls_name in ('CuratorRegisterTx', 'CuratorRotateTx', 'CuratorRevokeTx'):
              old = f'            return {cls_name}.from_dict(body)\n'
              new = f'            return {cls_name}.from_dict(body, expected_network_id=self.network_id)\n'
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit(f'Ledger {cls_name} parser wiring not found')
          p.write_text(s)
          PY

      - name: Verify governance module
        run: |
          python -m pytest tests/test_governance.py -vv --tb=short
          python - <<'PY'
          from chainbreaker.crypto import encode_public_key, generate_keypair
          from chainbreaker.governance import GovernanceContext, CuratorRegisterTx, make_governance_signature
          pairs = [generate_keypair() for _ in range(2)]
          pubs = [encode_public_key(p[1]) for p in pairs]
          net = 'chainbreaker-prod-audit'
          ctx = GovernanceContext(pubs, 2, network_id=net)
          body = {
              'action': 'curator_register',
              'curator_id': 'alice',
              'public_key_hex': '11' * 32,
              'activation_height': 2,
              'previous_registry_root': '22' * 32,
              'network_id': net,
              'schema_version': 1,
          }
          sigs = [make_governance_signature(sk, body, i, network_id=net) for i, (sk, _) in enumerate(pairs)]
          signed = dict(body, governance_signatures=[s.to_dict() for s in sigs])
          tx = CuratorRegisterTx.from_dict(signed, expected_network_id=net)
          ctx.verify_governance_signatures(body, tx.governance_signatures)
          assert tx.network_id == net
          PY

      - name: Static checks
        run: |
          ruff check chainbreaker/governance.py chainbreaker/chain.py
          mypy chainbreaker/governance.py chainbreaker/chain.py

      - name: Commit verified governance fix
        run: |
          rm .github/workflows/audit-governance-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chainbreaker/governance.py chainbreaker/chain.py .github/workflows/audit-governance-fix.yml
          git diff --cached --check
          git commit -m "fix governance network identity propagation"
          git push origin HEAD:repo-sequential-audit
